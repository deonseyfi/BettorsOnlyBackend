# /etc/nginx/sites-available/bettorsonly.conf
#
# Two server blocks: root domain serves the built React app as static files,
# api subdomain reverse-proxies to the Node backend on localhost:3000.
# Both terminate SSL. Certbot manages the certs.

# ── Redirect naked HTTP → HTTPS for both hostnames ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bettorsonly.com www.bettorsonly.com api.bettorsonly.com;

    # Let Certbot pass its ACME challenge over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend: bettorsonly.com + www redirect ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bettorsonly.com;

    ssl_certificate     /etc/letsencrypt/live/bettorsonly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettorsonly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www → apex canonical form.
    return 301 https://bettorsonly.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bettorsonly.com;

    ssl_certificate     /etc/letsencrypt/live/bettorsonly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettorsonly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bettorsonly/dist;
    index index.html;

    # Long-cache hashed JS/CSS/font/image assets — Vite emits content hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every non-file URL serves index.html so client-side routing works.
    # index.html must NOT be cached: it's tiny and always references the latest
    # content-hashed bundle names. Caching it means users keep loading stale JS.
    # Nginx's add_header rule: any add_header in a location wipes inherited ones,
    # so the security headers below have to be repeated here to apply to HTML.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Server-level security headers — inherited by any location that doesn't
    # declare its own add_header. Right now only /assets/ (which doesn't need
    # them) falls through here.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Log to a per-site file for easier grepping.
    access_log /var/log/nginx/bettorsonly.access.log;
    error_log  /var/log/nginx/bettorsonly.error.log;
}

# ── Backend: api.bettorsonly.com ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bettorsonly.com;

    ssl_certificate     /etc/letsencrypt/live/bettorsonly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettorsonly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Stripe webhooks send a JSON body up to a few hundred KB — bump the default.
    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/api.bettorsonly.access.log;
    error_log  /var/log/nginx/api.bettorsonly.error.log;
}
